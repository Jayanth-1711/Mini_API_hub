<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini API Hub – Weather</title>
  <style>
    /* ── Reset & Base ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    /* ── Form ──────────────────────────────────────── */
    .fetch-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 480px;
    }

    .fetch-form input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .fetch-form input:focus { border-color: #38bdf8; }

    .fetch-form button {
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .fetch-form button:hover { background: #7dd3fc; }

    /* ── Status ────────────────────────────────────── */
    #status {
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      min-height: 1.4em;
    }

    .ok  { color: #4ade80; }
    .err { color: #f87171; }

    /* ── Cards ─────────────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem;
      position: relative;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: #38bdf8; }

    .card h3 {
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }

    .card p {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .card .temp {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .card .delete-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: none;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #f87171;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    .card .delete-btn:hover {
      background: #f871711a;
    }

    .empty {
      color: #64748b;
      text-align: center;
      grid-column: 1 / -1;
      padding: 3rem 0;
      font-size: 1.1rem;
    }

    /* ── Footer ────────────────────────────────────── */
    footer {
      margin-top: 3rem;
      color: #475569;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>⚡ Mini API Hub</h1>
  <p class="subtitle">Fetch live weather → clean → store in PostgreSQL → display</p>

  <!-- City input + fetch button -->
  <form class="fetch-form" id="fetchForm">
    <input type="text" id="cityInput" placeholder="Enter city name…" required />
    <button type="submit">Fetch Weather</button>
  </form>

  <div id="status"></div>

  <!-- Weather cards rendered here -->
  <div class="cards" id="cardsContainer">
    <p class="empty">No weather data yet. Fetch a city above! ☁️</p>
  </div>

  <footer>Mini API Hub &middot; Node + PostgreSQL + Express</footer>

  <script>
    const API  = '';  // same origin, so blank base works
    const form = document.getElementById('fetchForm');
    const city = document.getElementById('cityInput');
    const status = document.getElementById('status');
    const cards  = document.getElementById('cardsContainer');

    // ── Load existing records on page load ───────────
    async function loadWeather() {
      try {
        const res  = await fetch(`${API}/api/weather`);
        const json = await res.json();

        if (!json.success || json.data.length === 0) {
          cards.innerHTML = '<p class="empty">No weather data yet. Fetch a city above! ☁️</p>';
          return;
        }

        cards.innerHTML = json.data.map(r => cardHTML(r)).join('');
      } catch (e) {
        cards.innerHTML = '<p class="empty">⚠️ Could not load data.</p>';
      }
    }

    // ── Fetch weather for a city ─────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = city.value.trim();
      if (!name) return;

      status.textContent = `Fetching weather for "${name}"…`;
      status.className = '';

      try {
        const res = await fetch(`${API}/api/weather/fetch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ city: name }),
        });

        const json = await res.json();

        if (!json.success) {
          status.textContent = `❌ ${json.error}`;
          status.className = 'err';
          return;
        }

        status.textContent = `✅ ${json.message}`;
        status.className = 'ok';
        city.value = '';
        loadWeather();

      } catch (e) {
        status.textContent = '❌ Network error. Is the server running?';
        status.className = 'err';
      }
    });

    // ── Delete a record ──────────────────────────────
    async function deleteRecord(id) {
      if (!confirm('Delete this record?')) return;

      try {
        const res  = await fetch(`${API}/api/weather/${id}`, { method: 'DELETE' });
        const json = await res.json();

        if (json.success) {
          status.textContent = `🗑️ ${json.message}`;
          status.className = 'ok';
          loadWeather();
        } else {
          status.textContent = `❌ ${json.error}`;
          status.className = 'err';
        }
      } catch (e) {
        status.textContent = '❌ Could not delete.';
        status.className = 'err';
      }
    }

    // ── Build a card ─────────────────────────────────
    function cardHTML(r) {
      const date = new Date(r.fetched_at).toLocaleString();
      return `
        <div class="card">
          <button class="delete-btn" onclick="deleteRecord(${r.id})">✕</button>
          <h3>${r.city}, ${r.country}</h3>
          <p class="temp">${r.temp_c}°C</p>
          <p>Feels like ${r.feels_like}°C &middot; ${r.humidity}% humidity</p>
          <p style="text-transform:capitalize">${r.description}</p>
          <p style="margin-top:0.5rem;color:#64748b;font-size:0.78rem">${date}</p>
        </div>`;
    }

    // ── Init ─────────────────────────────────────────
    loadWeather();
  </script>
</body>
</html>
